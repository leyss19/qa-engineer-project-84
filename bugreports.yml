- summary: |
    Ошибка при отправке запросов и получении ответов
  environment: |
    Google Chrome	151.0.7922.108 (Официальная сборка) (64 бит)
    ОС Windows 11 Home
  steps-to-reproduce: |
    - Открыть DevTools
    - Перейти на вкладку Network
    - Обновить страницу
    - Выполнить основные действия на сайте:открыть категорию, применить фильтр, открыть карточку товара, оформить заказ
    - Проверить список отправленных запросов
    - Проверить статус-коды ответов на запросы
  expected-result: |
    Запрос должен успешно отправляться, а пользователь должен получать ответ без ошибок
  actual-result: |
    Запрос не отправляется и при его обработке возникает ошибка

