    Открыта страница товаров
  test-data: |
    Товар: любой товар из списка
  steps:
    - Нажать на карточку товара
  expected-result: |
    На странице товара выводится название, рейтинг, цена со скидкой и без нее

- summary: |
    Успешное добавление товара в корзину, просмотр корзины
