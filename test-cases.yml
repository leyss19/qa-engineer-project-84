- summary: |
    Корректная работа сайта в разных браузерах
  requirement: |
    Сайт должен корректно отображаться и работать в поддерживаемых браузерах
  prerequisites:  |
    Открыта страница сайта
  test-data: |
    Браузеры: Google Chrome, Mozilla Firefox
  steps:
    - Открыть сайт в Google Chrome
    - Проверить отображение и работу основных элементов сайта
    - Открыть сайт в Mozilla Firefox
    - Проверить отображение и работу основных элементов сайта
    - Открыть сайт в Microsoft Edge
    - Проверить отображение и работу основных элементов сайта
  expected-result: |
    Сайт корректно отображается и работает во всех проверенных браузерах. Фильтры, карточки товаров, корзина и кнопки работают корректно
