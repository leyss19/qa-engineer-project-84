  test-data: |
    Товар: любой товар из списка
  steps:
    - В карточке товара нажать на кнопку «Корзина»
    - Нажать на кнопку «в корзину»
  expected-result: |
    Товар добавляется в корзину, можно посмотреть содержимое корзины

