---
- summary: |
    Успешный поиск товаров по ключевому слову или категории
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову или категории
  prerequisites:  |
    Открыта страница товаров
  steps:  |
  - В фильтре выбрать категорию «fragrances»
  expected-result: |
    Отображаются товары выбранной категории

- summary: |
    Успешное фильтрование товаров
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:  |
    Открыта страница товаров
  steps:  |
  - В фильтре выбрать категорию «furniture»
  - Поставить галочку в наличии
  - Указать цену от 1000
  expected-result: |
    Отображаются товары по выбранному фильтру

- summary: |
    Успешный просмотр товаров, подробная информация о товаре
  requirement: |
    Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
  prerequisites:  |
    Открыта страница товаров
  steps:  |
  - Нажать на карточку товара
  expected-result: |
    Отображаются товары, подробная информация о товаре

- summary: |
    Успешное добавление товара в корзину, просмотр корзины
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  prerequisites:  |
    Открыта страница товаров
  steps:  |
  - В карточке товара нажать на кнопку «Корзина»
  - Нажать на кнопку «в корзину»
  expected-result: |
    Товар добавляется в корзину, можно посмотреть содержимое корзины

- summary: |
    Успешное переключение языка интерфейса
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  prerequisites:  |
    Открыта страница товаров
  steps:  |
  - Выбрать язык русский
  expected-result: |
    Переключение языка интерфейса

- summary: |
    Успешное фильтрование товаров
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:  |
    Открыта страница товаров
  steps:  |
    - Выбрать категорию
    - Выбрать производителя
  expected-result: |
    Фильтрование товаров
