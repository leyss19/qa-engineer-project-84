- summary: |
    Успешный поиск товаров по ключевому слову
  requirement: |
    Пользователь должен иметь возможность искать товары по ключевому слову
  prerequisites:  |
    Открыта страница товаров
  test-data: |
    Ключевое слово: Powder
  steps:
    - Ввести в поле поиска «Powder»
  expected-result: |
    Отображаются товары по ключевому слову

    Успешный поиск товаров по категории
  requirement: |
    Пользователь должен иметь возможность искать товары по категории
  prerequisites:  |
    Открыта страница товаров
  test-data: |
    Категория: fragrances
  steps:
    - Открыть список категорий
    - Выбрать категорию «fragrances»
  expected-result: |
    Отображаются товары выбранной категории

- summary: |
    Успешное фильтрование товаров
  requirement: |
    Пользователь должен иметь возможность фильтровать товары
  prerequisites:  |
    Открыта страница товаров
  test-data: |
    Категория: fragrances
    Производитель: Calvin Klein
    Цена от: 1000
  steps:
    - В фильтре выбрать категорию
    - Выбрать производителя
    - Указать цену от 1000
  expected-result: |
